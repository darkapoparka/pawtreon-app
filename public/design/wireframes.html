<script>
'use strict';
const allRoutes=JSON.parse(document.getElementById('route-data').textContent).routes;
const byId=new Map(allRoutes.map(r=>[r.id,r]));
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(text,id,cls='')=>`<a href="#${esc(id)}" class="${cls}" data-to="${esc(id)}">${esc(text)}</a>`;
const examples=[{title:'Surgery for little Misho',species:'Cats',need:'Medical',organizer:'Maria · Personal',amount:1240,goal:2000,to:'case'},{title:'Food for our street cats',species:'Cats',need:'Food',organizer:'Street Cats · Organization',amount:890,goal:1500,to:'campaign'},{title:'Winter shelters',species:'Cats',need:'Shelter',organizer:'Local carers · Organization',amount:1560,goal:3000,to:'campaign'},{title:'Care for a rescued dog',species:'Dogs',need:'Medical',organizer:'Vet team · Clinic',amount:670,goal:1200,to:'case'}];
let current='home',mode='default',species='All',selectedCity='Varna',draftKind='case';
const scrollPositions={},formValues={},stateByScreen={};
function money(v){return '€'+v.toLocaleString('en-US');}
function header(){return `<header class="app-header"><a href="#home" class="brand" data-to="home">Pawtreon</a>${link(selectedCity+' ⌄','location','city')}<a href="#account" class="icon-button" aria-label="Open account" data-to="account"><span class="avatar" aria-hidden="true">ME</span></a></header>`;}
function taskHeader(r){return `<header class="task-header">${link('←',r.back,'icon-button')}<strong>${esc(r.title)}</strong></header>`;}
function searchbar(){return `<div class="searchbar">${link('⌕  Search cases and campaigns…','search','searchbox')}${link('☷','filters','filter-button').replace('class="filter-button"','class="filter-button" aria-label="Open filters"')}</div>`;}
function chips(){return `<div class="chips" aria-label="Species filters">${['All','Cats','Dogs','Other'].map(s=>`<button class="chip ${species===s?'active':''}" data-species="${s}" aria-pressed="${species===s}">${s}</button>`).join('')}</div>`;}
function photo(text,cls=''){return `<div class="placeholder ${cls}">${esc(text)}</div>`;}
function progress(amount=1240,goal=2000){return `<progress class="progress" value="${amount}" max="${goal}" aria-label="Illustrative funding progress"></progress><p class="funds"><strong>${money(amount)}</strong> of ${money(goal)} <span class="meta">· illustrative</span></p>`;}
function cards(campaignOnly=false){const data=examples.filter(x=>species==='All'||x.species===species).filter(x=>!campaignOnly||x.to==='campaign');if(!data.length)return `<div class="screen-message">No matching example cases. ${link('Clear filters','home')}</div>`;return `<div class="card-grid">${data.map(x=>`<article class="case-card"><div class="photo-link">${link('',x.to).replace('</a>',photo(x.species+' photograph')+'</a>')}<a href="#sign-in" data-to="sign-in" class="card-save" aria-label="Save ${esc(x.title)}">♡</a></div><div class="card-content">${link(x.title,x.to).replace('>'+esc(x.title)+'</a>','><h3>'+esc(x.title)+'</h3></a>')}<div class="meta">${x.need} · ${esc(selectedCity)}</div>${progress(x.amount,x.goal)}<div class="organizer"><span class="avatar" aria-hidden="true">P</span><span>${esc(x.organizer)}</span></div></div></article>`).join('')}</div>`;}
function overview(r){return r.sections.map((s,i)=>`<div class="row"><span>${esc(s)}</span><span class="meta">${i===0?'': '—'}</span></div>`).join('');}
function actionLinks(r,start=0){return `<div class="sub-actions">${r.actions.slice(start).map(a=>link(a.label,a.to)).join('')}</div>`;}
function field(f,i,r){const[label,type,initial]=f;const id='field-'+i;const cached=formValues[r.id]?.[label];const val=cached??initial;const optional=r.kind==='sheet'||label.includes('(optional)')||type==='checkbox'&&label.includes('Keep my name');if(type==='checkbox')return `<label class="form-field check" for="${id}"><input id="${id}" name="${esc(label)}" type="checkbox" ${cached?'checked':''} ${optional?'':'required'}>${esc(label)}</label>`;if(type==='select')return `<label class="form-field" for="${id}">${esc(label)}<select id="${id}" name="${esc(label)}">${initial.split('|').map(s=>`<option ${cached===s?'selected':''}>${esc(s)}</option>`).join('')}</select></label>`;if(type==='textarea')return `<label class="form-field" for="${id}">${esc(label)}<textarea id="${id}" name="${esc(label)}" ${optional?'':'required'}>${esc(cached??'')}</textarea></label>`;if(type==='file')return `<label class="form-field" for="${id}">${esc(label)}<input id="${id}" name="${esc(label)}" type="file" accept="image/*,.pdf"><span class="meta">Prototype: file stays in this browser; nothing is uploaded.</span></label>`;return `<label class="form-field" for="${id}">${esc(label)}<input id="${id}" name="${esc(label)}" type="${esc(type)}" value="${esc(val)}" ${optional?'':'required'} ${type==='number'?'min="1" step="1" inputmode="decimal"':''} autocomplete="${type==='email'?'email':'off'}"></label>`;}
function form(r){return `<form id="route-form" data-next="${r.actions[0]?.to||r.back}">${r.fields.map((f,i)=>field(f,i,r)).join('')}</form>`;}
function stateMessage(r){if(mode==='default')return '';if(mode==='loading'||mode==='submitting'||mode==='uploading')return `<div class="screen-message" role="status">${esc(mode)} — this is a preview state.</div><div class="skeleton"></div><div class="skeleton"></div>`;if(mode==='permission-denied')return `<div class="screen-message">You do not have access to this operation. The real app must enforce this on the server. ${link('Back to account','account')}</div>`;if(mode==='empty')return `<div class="screen-message">Nothing to show in this example state. ${link('Browse cases','home')}</div>`;const messages={offline:'You are offline. No changes or payment have been confirmed.',error:'Something went wrong. Keep the current input and offer a useful retry.',pending:'We are checking the payment. Do not show a receipt or increment funding yet.',succeeded:'Confirmed contribution — simulated success state only.',failed:'The payment did not complete. Preserve the amount and allow retry.',canceled:'Payment canceled. You have not made a new contribution.',submitted:'Submitted for review. This is not publication or payment approval.','needs-changes':'Changes are needed. Show specific feedback and return to the relevant step.',published:'Published-content preview. Funding still depends on separate readiness.',resolved:'This case is resolved. Do not display an urgent or enabled donation action.',paused:'This fundraiser is paused. Contributions are unavailable.','funding-unavailable':'Fundraising is not available for this recipient. Offer non-monetary help.','not-ready':'Provider approval/onboarding is not complete. No payout can be promised.','location-denied':'Location permission was denied. Choose a city manually.',expired:'This link or verification has expired. Offer a safe recovery path.'};return `<div class="screen-message" role="status">${esc(messages[mode]||mode.replaceAll('-',' ')+' — preview this state with a clear recovery action.')}</div>`;}
function primaryFooter(r){if(['home','catalog','search','map','account','list','profile'].includes(r.kind)&&!['manage-list'].includes(r.id))return dock(r);if(!r.actions.length)return '';let a=r.actions[0];if(r.id==='donation-status'&&mode!=='succeeded')a={label:'Back to fundraiser',to:'campaign'};if((r.kind==='case'||r.kind==='campaign')&&['paused','resolved','completed','funding-unavailable'].includes(mode))return `<div class="task-footer">${link('Help another way','offer-help','button secondary')}</div>`;const main=r.fields.length?`<button class="button" type="submit" form="route-form">${esc(a.label)}</button>`:link(a.label,a.to,'button');return `<div class="task-footer">${main}</div>`;}
function dock(r){return `<nav class="app-nav" aria-label="Primary">${[['home','Cases','▦'],['create','Create','+'],['campaigns','Campaigns','♡']].map(([id,label,icon])=>`<a href="#${id}" data-to="${id}" class="${(id==='home'&&r.id!=='campaigns')||id===r.id?'active':''}"><span class="${id==='create'?'create-icon':'nav-icon'}" aria-hidden="true">${icon}</span>${label}</a>`).join('')}</nav>`;}
function content(r){const common=`<span class="scope-label">${esc(r.group)} · wireframe</span>`;let body='';
if(r.kind==='home'){body=`${header()}<div class="page">${searchbar()}${chips()}<section class="hero"><p class="eyebrow">Community campaign</p><h2>Warm homes.<br>Brighter tomorrows.</h2><p>Help build shelters for street cats this winter.</p>${link('Support campaign →','campaign','button small secondary')}</section><div class="section-head"><h2>Cases near you</h2><div class="mini-controls"><button data-sort="true" aria-label="Change sorting">Nearby ⌄</button>${link('Map','map')}</div></div>${cards()}</div>`;}
else if(r.kind==='catalog'||r.kind==='search'){body=`${header()}<div class="page">${searchbar()}${chips()}<div class="section-head"><h2>${esc(r.title)}</h2>${link('Filters','filters','meta')}</div>${r.kind==='search'?`<p class="meta">${examples.filter(x=>species==='All'||x.species===species).length} illustrative results · ${esc(selectedCity)}</p>`:''}${cards(r.id==='campaigns')}${actionLinks(r)}</div>`;}
else if(r.kind==='map'){body=`${header()}<div class="page">${searchbar()}${chips()}<div class="map-canvas"><span class="map-pin">2</span><strong>Approximate area around ${esc(selectedCity)}</strong><span>Wireframe map placeholder.<br>No actual animal coordinates or location request.</span></div><div class="block"><span class="badge">Selected case</span><h2>Help Misho recover</h2><p>Medical care · approximate city area</p>${progress()}${link('View case','case','button secondary')}</div>${actionLinks(r)}</div>`;}
else if(r.kind==='case'||r.kind==='campaign'){body=`${taskHeader(r)}${r.kind==='campaign'?`<div class="placeholder campaign-photo"><p class="eyebrow">Campaign photo area</p><h1>A kinder ${esc(selectedCity)} for street cats.</h1><p>Food. Shelters. Medical care.</p></div>`:photo('Animal gallery — original case photographs','detail-photo')}<div class="detail-sheet">${r.kind==='case'?`<span class="badge">Medical care</span><h1>${esc(r.title)}</h1>`:`<span class="badge">Community campaign</span><h1>Winter homes for street cats</h1>`}<div class="organizer"><span class="avatar">P</span><span>${r.kind==='case'?'Maria · Personal organizer':'Street Cats · Organization'}<br><span class="meta">${esc(selectedCity)} · approximate area</span></span></div>${progress(r.kind==='case'?1240:4320,r.kind==='case'?2000:6000)}<p class="simulation">Illustrative story and amounts. Not a real fundraising claim or verification.</p><div class="block"><h2>Why help is needed</h2><p>Space for the responsible organizer's real story, current situation and specific plan. This copy is a wireframe, not evidence.</p></div><div class="block"><h2>Plan and budget</h2>${r.kind==='campaign'?'<div class="row"><span>Shelter materials</span><span>Itemized cost</span></div><div class="row"><span>Placement and care</span><span>Actual plan</span></div>':'<div class="row"><span>Veterinary estimate</span><span>Private evidence</span></div>'}<p>Show the beneficiary and explain how funds are used.</p></div><div class="block"><h2>Updates and evidence</h2><p>Dated organizer updates and redacted supporting information.</p></div>${actionLinks(r,1)}</div>`;}
else if(r.kind==='updates'){body=`${taskHeader(r)}<div class="page">${common}<h1>${esc(r.title)}</h1><div class="timeline"><div class="block"><span class="meta">Example update · organizer</span><h2>The next step</h2>${photo('Progress photograph')}<p>Real implementation uses the actual date, author and verified progress.</p></div><div class="block"><span class="meta">Earlier update</span><h2>Where we started</h2><p>Explain the initial need without manufactured urgency.</p></div></div>${actionLinks(r)}</div>`;}
else if(r.kind==='profile'){body=`${taskHeader(r)}<div class="page">${photo('Profile cover photograph')}<div class="organizer"><span class="avatar">P</span><div><h1>${r.id==='person'?'Maria Ivanova':'Street Cats Varna'}</h1><span class="meta">Illustrative ${r.id==='person'?'personal':'organization'} profile</span></div></div><p class="body-copy">A named organizer, their service area and their genuine rescue work.</p><div class="block">${overview(r)}</div><div class="section-head"><h2>Active work</h2></div>${cards()}${actionLinks(r)}</div>`;}
else if(r.kind==='donate'){body=`${taskHeader(r)}<div class="page">${common}<h1>Make a difference</h1><div class="block"><h2>Winter homes for street cats</h2><p>Recipient: illustrative organization<br>Funding availability must be confirmed by an approved provider.</p></div><div class="amounts">${[10,20,50,100].map(v=>`<button type="button" data-amount="${v}" class="${v===20?'selected':''}">€${v}</button>`).join('')}</div>${form(r)}<div class="block"><div class="row"><span>Contribution</span><strong id="contribution-total">€20</strong></div><div class="row"><span>Fees</span><span>Disclosed before payment</span></div></div><p class="simulation">No card fields or real checkout. The button only previews the next wireframe. Processor approval is unresolved.</p>${actionLinks(r,1)}</div>`;}
else if(r.kind==='receipt'){body=`${taskHeader(r)}<div class="page">${common}<h1>Thank you for helping</h1><p class="simulation">ILLUSTRATIVE RECEIPT — not a payment or tax document.</p><div class="block"><h2>Contribution summary</h2><div class="row"><span>Campaign</span><span>Winter homes</span></div><div class="row"><span>Contribution</span><strong>€20.00</strong></div><div class="row"><span>Reference</span><span>DEMO-ONLY</span></div><div class="row"><span>Recipient</span><span>Example organization</span></div></div><p class="body-copy">Production receipts use a trusted transaction and an access-controlled URL.</p>${actionLinks(r,1)}</div>`;}
else if(r.kind==='choice'){body=`${taskHeader(r)}<div class="page">${common}<h1>What needs help?</h1><div class="block"><span class="meta">Acting as</span><h2>Your personal profile ⌄</h2>${link('Switch in account','account','meta')}</div><div class="selection-list"><a class="selection" href="#create-basics" data-kind="case" data-to="create-basics"><strong>An animal case →</strong><span>A particular animal or group needs treatment, food, shelter or foster care.</span></a><a class="selection" href="#create-basics" data-kind="campaign" data-to="create-basics"><strong>A community campaign →</strong><span>A coordinated initiative such as neighborhood winter shelters.</span></a></div>${link('Resume a draft','create-story','button secondary')}</div>`;}
else if(r.kind==='auth'||r.kind==='form'||r.kind==='wizard'){const step=['create-basics','create-story','create-funding','create-review'].indexOf(r.id)+1;body=`${taskHeader(r)}<div class="page">${common}${step?`<div class="step" role="group" aria-label="Step ${step} of 4">${[1,2,3,4].map(i=>`<i class="${i<=step?'done':''}"></i>`).join('')}</div><p class="meta">Step ${step} of 4 · ${draftKind==='campaign'?'Community campaign':'Animal case'}</p>`:''}<h1>${esc(r.title)}</h1><p class="body-copy">${esc(r.sections[0])}</p>${r.id==='create-review'?`<div class="block"><h2>Public preview</h2>${photo('Selected original photograph')}<p>Review title, organizer, location privacy, story and budget before submitting.</p></div>`:''}${form(r)}<p class="simulation">Prototype fields stay in this page session. Nothing is signed in, submitted, published, verified or uploaded.</p>${actionLinks(r,1)}</div>`;}
else if(r.kind==='account'){body=`${header()}<div class="page">${common}<h1>Your Pawtreon</h1><div class="block"><div class="organizer"><span class="avatar">ME</span><strong>Your personal identity</strong></div><p>Switch to an organization without creating another login.</p></div><div class="selection-list">${r.actions.map(a=>link(a.label,a.to,'selection')).join('')}</div></div>`;}
else if(r.kind==='list'){body=`${taskHeader(r)}<div class="page">${common}<h1>${esc(r.title)}</h1>${r.actions.map((a,i)=>`<a class="selection" href="#${a.to}" data-to="${a.to}"><strong>${esc(a.label)} →</strong><span>${esc(r.sections[i]||'Open details and current status')}</span></a>`).join('')}<div class="block">${overview(r)}</div></div>`;}
else if(r.kind==='workspace'||r.kind==='admin'){body=`${taskHeader(r)}<div class="page">${common}<h1>${esc(r.title)}</h1><p class="simulation">Private-route wireframe. ${esc(r.access)}. Real authorization is not implemented by this prototype.</p><div class="block"><span class="badge">${r.kind==='admin'?'Restricted review':'Acting identity: example organizer'}</span>${overview(r)}</div>${r.fields.length?form(r):''}<div class="selection-list">${r.actions.map(a=>link(a.label,a.to,'selection')).join('')}</div></div>`;}
else if(r.kind==='legal'){body=`${taskHeader(r)}<div class="page">${common}<h1>${esc(r.title)}</h1><p class="legal-alert">Policy structure only. This is not approved legal text. Actual operator details, policies and professional review are required before launch.</p>${r.sections.map((s,i)=>`<div class="block"><h2>${i+1}. ${esc(s)}</h2><p>Replace with the reviewed policy specific to Pawtreon's actual operation and approved payment model.</p></div>`).join('')}${actionLinks(r)}</div>`;}
else if(r.kind==='sheet'){body=`<div class="sheet-backdrop"><div class="sheet-body"><div class="sheet-handle"></div><div class="sheet-title"><h1>${esc(r.title)}</h1>${link('×',r.back,'icon-button').replace('class="icon-button"','class="icon-button" aria-label="Close sheet preview"')}</div><p class="meta">Overlay layout preview; production uses a focus-managed dialog primitive.</p>${r.fields.length?form(r):overview(r)}${actionLinks(r,r.fields.length?1:0)}</div></div>`;}
else{body=`${taskHeader(r)}<div class="page">${common}<h1>${esc(r.title)}</h1>${stateMessage(r)}<div class="block">${overview(r)}</div>${r.id==='donation-status'?`<p class="simulation">Use the State selector to inspect pending, succeeded, failed or canceled. These are simulations, not real payment outcomes.</p>`:''}${actionLinks(r,r.id==='donation-status'&&mode!=='succeeded'?1:0)}</div>`;}
return body;}
function render(){const r=byId.get(current)||byId.get('not-found');el('screen-picker').value=r.id;el('state-picker').innerHTML=r.states.map(s=>`<option value="${esc(s)}" ${s===mode?'selected':''}>${esc(s)}</option>`).join('');let html=content(r);if(['loading','empty','permission-denied'].includes(mode))html=taskHeader(r)+`<div class="page"><h1>${esc(r.title)}</h1>${stateMessage(r)}</div>`;else if(r.kind!=='status'&&mode!=='default')html=html.replace('</header>','</header>'+`<div class="page">${stateMessage(r)}</div>`);el('app-screen').innerHTML=html;el('footer').innerHTML=['loading','empty','permission-denied'].includes(mode)?dock(r):primaryFooter(r);el('contract').innerHTML=`<h2>${esc(r.title)}</h2><p><code>${esc(r.path)}</code> <span class="pill">${esc(r.id)}</span></p><p><strong>Access contract:</strong> ${esc(r.access)}</p><ul>${r.sections.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><strong>States:</strong> ${r.states.map(esc).join(' · ')}</p><p>These are planned product paths. This workbench uses hash navigation; it does not implement the public routes or their services.</p>`;document.querySelectorAll('#catalogue a').forEach(a=>a.setAttribute('aria-current',a.dataset.to===r.id?'page':'false'));el('announcement').textContent=`${r.title}. ${mode} wireframe state.`;el('app-screen').scrollTop=scrollPositions[current]||0;document.title=r.title+' — Pawtreon wireframe';}
function navigate(id){scrollPositions[current]=el('app-screen').scrollTop;current=byId.has(id)?id:'not-found';mode=stateByScreen[current]||byId.get(current).states[0];render();el('app-screen').focus({preventScroll:true});}
for(const group of [...new Set(allRoutes.map(r=>r.group))]){el('catalogue').insertAdjacentHTML('beforeend',`<h2>${esc(group)}</h2>`+allRoutes.filter(r=>r.group===group).map(r=>link(r.title,r.id)).join(''));}
el('screen-count').textContent=allRoutes.length+' screens and overlays';el('screen-picker').innerHTML=allRoutes.map(r=>`<option value="${r.id}">${esc(r.group+' / '+r.title)}</option>`).join('');
el('screen-picker').addEventListener('change',e=>location.hash=e.target.value);el('state-picker').addEventListener('change',e=>{mode=e.target.value;stateByScreen[current]=mode;render();});
function width(){const w=Number(el('width-picker').value);el('device').style.setProperty('--preview-width',w+'px');el('device').classList.toggle('width-small',Math.min(w,window.innerWidth)<375);}el('width-picker').addEventListener('change',width);window.addEventListener('resize',width);
document.addEventListener('click',e=>{const kind=e.target.closest('[data-kind]');if(kind)draftKind=kind.dataset.kind;const s=e.target.closest('[data-species]');if(s){species=s.dataset.species;if(current!=='search')location.hash='search';else render();}const sort=e.target.closest('[data-sort]');if(sort){sort.textContent=sort.textContent.includes('Nearby')?'Latest ⌄':'Nearby ⌄';el('announcement').textContent='Prototype sort selection changed.';}const amount=e.target.closest('[data-amount]');if(amount){const input=document.querySelector('input[type=number]');if(input){input.value=amount.dataset.amount;input.dispatchEvent(new Event('input',{bubbles:true}));}document.querySelectorAll('[data-amount]').forEach(b=>b.classList.toggle('selected',b===amount));}});
document.addEventListener('input',e=>{const f=e.target;if(f.closest('#route-form')&&f.name&&f.type!=='file'){formValues[current]??={};formValues[current][f.name]=f.type==='checkbox'?f.checked:f.value;if(current==='donate'&&f.type==='number'&&el('contribution-total'))el('contribution-total').textContent='€'+(f.value||'0');}});
document.addEventListener('change',e=>{const f=e.target;if(f.closest('#route-form')&&f.name&&f.type!=='file'){formValues[current]??={};formValues[current][f.name]=f.type==='checkbox'?f.checked:f.value;}});
document.addEventListener('submit',e=>{if(e.target.id!=='route-form')return;e.preventDefault();if(current==='location')selectedCity=e.target.querySelector('select').value;location.hash=e.target.dataset.next;});
window.addEventListener('hashchange',()=>navigate(decodeURIComponent(location.hash.slice(1))||'home'));width();navigate(decodeURIComponent(location.hash.slice(1))||'home');
</script>
</body>
